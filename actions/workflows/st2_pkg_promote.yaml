---
version: '1.0'
description: Promote a StackStorm package from source to target packagecloud repository.


input:
  - package
  - release
  - version
  - revision
  - distro_version
  - api_token
  - timeout:
  - distro_arch_map:
      debian: amd64
      el: x86_64
      ubuntu: amd64
  - distro_pkg_type_map:
      debian: deb
      el: rpm
      ubuntu: deb


vars:
  - tgt_repo: StackStorm/<% ctx().release %>
  - src_repo: StackStorm/staging-<% ctx().release %>
  - arch: <% ctx().distro_arch_map.get(ctx().distro_version.split("/")[0]) %>
  - package_type: <% ctx().distro_pkg_type_map.get(ctx().distro_version.split("/")[0]) %>
  - packagecloud_api_url: <% "https://" + ctx().api_token + ":@packagecloud.io"  %>


tasks:
  get_pkgs_list:
    action: packagecloud.list_packages
    input:
      repo: <% ctx().src_repo %>
      package: <% ctx().package %>
      distro_version: <% ctx().distro_version %>
      version: <% ctx().version %>
      release: <% ctx().revision %>
    next:
      - when: <% succeeded() and (len(result().result) > 0) %>
        do: get_pkg_meta
        publish:
          - pkgs_list: <% result().result %>
      - when: <% succeeded() and (len(result().result) <= 0) %>
        do: error
        publish:
          - err_msg: "An empty list was received for <% ctx().package %> <% ctx().version %> <% ctx().release %>."

  error:
    action: core.local
    input:
      cmd: |
        cat <<EOF 1>&2
        <% coalesce(ctx().get(err_msg), "Workflow logic error.  Check execution for details!") %>
        EOF
        exit 1

  get_pkg_meta:
    next:
      - when: <% succeeded() %>
        do: get_src_pkg_info
        publish:
          - revision: <% coalesce(ctx().revision, ctx().pkgs_list.first().get('release')) %>
          - src_pkg_url: <% ctx().packagecloud_api_url + ctx().pkgs_list.first().get('package_url') %>
          - tgt_pkg_url: <% ctx().packagecloud_api_url + ctx().pkgs_list.first().get('package_url').replace(ctx().src_repo, ctx().tgt_repo) %>

  get_src_pkg_info:
    action: core.http
    input:
      url: <% ctx().src_pkg_url %>
    next:
      - when: <% succeeded() %>
        publish:
          - download_url: <% result().body.download_url %>
          - filename: <% result().body.filename %>
          - url: <% result().body.package_html_url %>
        do: get_tgt_pkg_info

  get_tgt_pkg_info:
    action: core.http
    input:
      url: <% ctx().tgt_pkg_url %>
    next:
      - when: <% succeeded() %>
        do: checksum
      - when: <% failed() and (result().get(status_code, 0) = 404) %>
        do: promote
      - when: <% failed() and (result().get(status_code, 0) != 404) %>
        do: error
        publish:
          - err_msg: "http return code <% result().get(status_code, 0) %> when fetching <% ctx().tgt_pkg_url.split('@').last() %>"

  checksum:
    action: core.noop
    next:
      - when: <% task(get_tgt_pkg_info).result.body.sha512sum = task(get_src_pkg_info).result.body.sha512sum %>
        do: notify_success
      - when: <% task(get_tgt_pkg_info).result.body.sha512sum != task(get_src_pkg_info).result.body.sha512sum %>
        do: error
        publish:
          - err_msg: "sha512 checksum doesn't match between the source and target packages."

  promote:
    next:
      - do: download_src_pkg
        publish:
          - target: <% "-".join([now().format("%s"), str(random(100000, 999999)), ctx().filename]) %>

  download_src_pkg:
    action: core.local
    input:
      cmd: wget -qO "/tmp/<% ctx().target %>" "<% ctx().download_url %>"
      timeout: <% ctx().timeout %>
    next:
      - when: <% succeeded() %>
        do: get_distribution_id

  # The distribution version ID defined at packagecloud with map maintained in e2econfig.
  get_distribution_id:
    action: st2.kv.get_object
    input:
      key: packagecloud
    next:
      - when: <% succeeded() %>
        do: upload_src_pkg_to_prd
        publish:
          # 'distro_version' (e.g. 'ubuntu/jammy') is the package path and is the only information
          # the workflow has to find packagecloud's distribution id from the e2e configuration in the kvstore.
          - distro_version_id: <% result().result.distro.items().where($[1].package_path = ctx().distro_version).first()[1].id %>

  upload_src_pkg_to_prd:
    action: core.local
    input:
      env:
        LANG: "en_US.utf8"
        PACKAGECLOUD_TOKEN: "<% ctx().api_token %>"
      cmd: |
        curl --fail -X POST \
          -F "package[distro_version_id]=<% ctx().distro_version_id %>" \
          -F "package[package_file]=@/tmp/<% ctx().target %>" \
          "https://${PACKAGECLOUD_TOKEN}:@packagecloud.io/api/v1/repos/<% ctx().tgt_repo %>/packages.json"
      timeout: <% ctx().timeout %>
    next:
      - when: <% succeeded() %>
        do: notify_success
      - do: cleanup

  cleanup:
    action: core.local
    input:
      cmd: rm -rf /tmp/<% ctx().target %>

  notify_success:
    action: core.noop


output:
  - package: <% ctx().package %>
  - release: <% ctx().release %>
  - version: <% ctx().version %>
  - revision: <% ctx().revision %>
  - distro_version: <% ctx().distro_version %>
  - arch: <% ctx().arch %>
  - package_type: <% ctx().package_type %>
  - src_repo: <% ctx().src_repo %>
  - tgt_repo: <% ctx().tgt_repo %>
