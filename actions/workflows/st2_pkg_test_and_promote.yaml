---
version: '1.0'

# Use consistent naming of variables with a single purpose.  These
# parameters will probably be best set in the kv store so that all workflows
# share the same data without repeating it.

#~ unstable / dev

#~ st2test_branch: master
#~ st2bootstrap_branch: master
#~ packagecloud_repostiory: unstable
#~ package_distribution_path: ubuntu/jammy
#~ package_environment: staging
#~ package_version: 3.9dev

#~ unstable / vX.Ydev

#~ stable / latest

#~ st2test_branch: v3.8
#~ st2bootstrap_branch: v3.8
#~ packagecloud_repostiory: stable
#~ package_distribution_path: ubuntu/focal
#~ package_environment: ""
#~ package_version: 3.8.1

#~ stable / vX.Y.Z



input:
  - hostname
  - distro
  - release
  - version
  - keyfile
  - chatops
  - debug
  - pkg_env: staging
  - map_distro_to_repository:
      ROCKY8: el/8
      ROCKY9: el/9
      UBUNTU20: ubuntu/focal
      UBUNTU22: ubuntu/jammy
  - promoted_st2: false
  - promoted_st2chatops: false
  - promoted_st2web: false
  - notify_channels:
    - '#thunderdome'
  - notify_failure_channels:
    - '#thunderdome'
    - '#opstown'

vars:
  - versions: ""
  - webui_base_url: https://st2cicd.uswest2.stackstorm.net
  - pkg_distro_version: <% ctx().map_distro_to_repository.get(ctx().distro) %>
  - notify_route: errbot
  - bootstrap_branch: master

output:
  - versions: <% ctx().versions %>

tasks:
  notify_start:
    with: channel in <% ctx().notify_channels %>
    action: chatops.post_message
    input:
      channel: <% item(channel) %>
      route: <% ctx(notify_route) %>
      message: 'st2ci.st2_pkg_test_and_promote: STARTED'
      extra:
        slack:
          attachments:
            - fallback: "[st2ci.st2_pkg_test_and_promote: STARTED]"
              title: "[st2ci.st2_pkg_test_and_promote: STARTED]"
              title_link: "<% ctx().webui_base_url %>/#/history/<% ctx().st2.action_execution_id %>/general"
              text: |
                HOSTNAME: <% coalesce(ctx().hostname, "unspecified") %>
                DISTRO: <% ctx().distro %>
                RELEASE: <% ctx().pkg_env %> <% ctx().release %>
                VERSION: <% coalesce(ctx().version, 'latest') %>
              color: "#808080"
    next:
      - when: <% succeeded() %>
        do: run_e2e_test
        publish:
          - suffix: <% now().format("%s") %>

  run_e2e_test:
    action: st2ci.st2_pkg_e2e_test
    input:
      hostname: <% coalesce( ctx().hostname, "st2-pkg-" + ctx().release + "-" + ctx().distro.toLower() + "-" + str(ctx().suffix) ) %>
      distro: <% ctx().distro %>
      release: <% ctx().release %>
      version: <% ctx().version %>
      pkg_env: <% ctx().pkg_env %>
      keyfile: <% ctx().keyfile %>
      chatops: <% ctx().chatops %>
      debug: <% ctx().debug %>
      bootstrap_branch: <% ctx().bootstrap_branch %>
    next:
      - when: <% succeeded() %>
        publish:
          - versions: <% result().output.versions %>
          - version_str: <% result().output.versions.items().select( $[0] + "=" + $[1]).join("\n\t") %>
        do: promote_st2

  promote_st2:
    action: st2ci.st2_pkg_promote
    input:
      package: st2
      distro_version: <% ctx().pkg_distro_version %>
      release: <% ctx().release %>
      version: <% ctx().versions.get(st2).split("-")[0] %>
      revision: <% ctx().versions.get(st2).split("-")[1] %>
    next:
      - when: <% succeeded() %>
        publish:
          - promoted_st2: <% ctx().versions.get(st2) %>
        do: promote_st2chatops
      - when: <% failed() %>
        do: promote_st2chatops

  promote_st2chatops:
    action: st2ci.st2_pkg_promote
    input:
      package: st2chatops
      distro_version: <% ctx().pkg_distro_version %>
      release: <% ctx().release %>
      version: <% ctx().versions.get(st2chatops).split("-")[0] %>
      revision: <% ctx().versions.get(st2chatops).split("-")[1] %>
    next:
      - when: <% succeeded() %>
        publish:
          - promoted_st2chatops: <% ctx().versions.get(st2chatops) %>
        do: promote_st2web
      - when: <% failed() %>
        do: promote_st2web

  promote_st2web:
    action: st2ci.st2_pkg_promote
    input:
      package: st2web
      distro_version: <% ctx().pkg_distro_version %>
      release: <% ctx().release %>
      version: <% ctx().versions.get(st2web).split("-")[0] %>
      revision: <% ctx().versions.get(st2web).split("-")[1] %>
    next:
      - when: <% succeeded() %>
        publish:
          - promoted_st2web: <% ctx().versions.get(st2web) %>
        do: process_completion
      - when: <% failed() %>
        do: process_completion

  process_completion:
    action: core.noop
    next:
      - when: <% succeeded() and (ctx().promoted_st2 and ctx().promoted_st2chatops and ctx().promoted_st2web) %>
        do: set_notify_success
      - when: <% succeeded() and not (ctx().promoted_st2 and ctx().promoted_st2chatops and ctx().promoted_st2web) %>
        do: set_notify_failure

  set_notify_failure:
    action: core.noop
    next:
      - when: <% succeeded() %>
        publish:
          - notify_color: '#FF0000'
          - notify_completion_channels: <% ctx().notify_failure_channels %>
        do: notify_failure

  set_notify_success:
    action: core.noop
    next:
      - when: <% succeeded() %>
        publish:
          - notify_color: '#008000'
          - notify_completion_channels: <% ctx().notify_channels %>
        do: notify_completion

  notify_completion:
    with: channel in <% ctx().notify_completion_channels %>
    action: chatops.post_message
    input:
      channel: <% item(channel) %>
      route: <% ctx(notify_route) %>
      message: 'st2ci.st2_pkg_test_and_promote: COMPLETED'
      extra:
        slack:
          attachments:
            - fallback: "[st2ci.st2_pkg_test_and_promote: COMPLETED]"
              title: "[st2ci.st2_pkg_test_and_promote: COMPLETED]"
              title_link: "<% ctx().webui_base_url %>/#/history/<% ctx().st2.action_execution_id %>/general"
              text: |
                HOSTNAME: <% coalesce(ctx().hostname, "unspecified") %>
                DISTRO: <% ctx().distro %>
                RELEASE: <% ctx().pkg_env %> <% ctx().release %>
                VERSION: <% coalesce(ctx().version, 'latest') %>
                VERSION TESTED:
                  <% ctx().version_str %>
                PACKAGE PROMOTED:
                  st2=<% ctx().promoted_st2 %>
                  st2chatops=<% ctx().promoted_st2chatops %>
                  st2web=<% ctx().promoted_st2web %>
              color: "<% ctx().notify_color %>"

  notify_failure:
    with: channel in <% ctx().notify_failure_channels %>
    action: chatops.post_message
    input:
      channel: <% item(channel) %>
      route: <% ctx(notify_route) %>
      message: 'st2ci.st2_pkg_test_and_promote: FAILED'
      extra:
        slack:
          attachments:
            - fallback: "[st2ci.st2_pkg_test_and_promote: FAILED]"
              title: "[st2ci.st2_pkg_test_and_promote: FAILED]"
              title_link: "<% ctx().webui_base_url %>/#/history/<% ctx().st2.action_execution_id %>/general"
              text: |
                HOSTNAME: <% coalesce(ctx().hostname, "unspecified") %>
                DISTRO: <% ctx().distro %>
                RELEASE: <% ctx().pkg_env %> <% ctx().release %>
                VERSION: <% coalesce(ctx().version, 'latest') %>
              color: "#FF0000"
    next:
      - do: fail
