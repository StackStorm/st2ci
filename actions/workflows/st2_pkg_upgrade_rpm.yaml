---
version: '1.0'
description: Upgrade rpm packages to latest revision of specified version
input:
  - host
  - pkg_list
  - version
  - distro

tasks:
  init:
    action: core.noop
    next:
      - when: <% ctx().distro in ['rocky8', 'rhel8'] %>
        do: upgrade_deps_el8
      - when: <% ctx().distro in ['centos7', 'rhel7'] %>
        do: upgrade_deps_el7

  upgrade_deps_el8:
    action: st2ci.st2_pkg_upgrade_deps_el8
    input:
      hosts: <% ctx().host %>
      version: <% ctx().version %>
      timeout: 180
    next:
      - when: <% succeeded() %>
        do: install_pkg
        publish:
          - pkg_list: <% ctx().pkg_list %>

  upgrade_deps_el7:
    action: st2ci.st2_pkg_upgrade_deps_el7
    input:
      hosts: <% ctx().host %>
      version: <% ctx().version %>
      timeout: 180
    next:
      - when: <% succeeded() %>
        do: install_pkg
        publish:
          - pkg_list: <% ctx().pkg_list %>

  install_pkg:
    with:
      items: <% ctx().pkg_list %>
      concurrency: 1
    action: st2ci.install_latest_revision_of_rpm_pkg
    input:
      host: <% ctx().host %>
      distro: <% ctx().distro %>
      pkg: <% item() %>
      version: <% ctx().version %>
