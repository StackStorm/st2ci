---
version: '1.0'

input:
  - environment_source
  - environment_target
  - distributions
  - keyfile
  - chatops
  - debug

vars:
  - versions: ""
  - webui_base_url: https://st2cicd.uswest2.stackstorm.net
  - notify_route: errbot

tasks:
  load_source_cfg:
    action: st2ci.e2e_config
    input:
      environment: <% ctx().environment_source %>
    next:
      - do: load_target_cfg
        when: <% succeeded() %>
        publish:
          - cfgsrc: <% result().result %>
          # The workflow doesn't handle multiple windows instances, so the first one is used.
          - windows_distro: <% ctx().cfgsrc.st2.distributions.windows.keys().first() %>
          - windows_instance_type: <% ctx().cfgsrc.st2.distributions.windows[ctx().windows_distro].aws.default.type %>

  load_target_cfg:
    action: st2ci.e2e_config
    input:
      environment: <% ctx().environment_target %>
    next:
      - do: test_e2e_per_distro
        when: <% succeeded() %>
        publish:
          - cfgtgt: <% result().result %>

  test_e2e_per_distro:
    action: st2ci.st2_pkg_test_and_promote
    with:
      items: <% ctx().cfgsrc.st2.distributions.linux.keys().toList() %>
      concurrency: <% len(ctx().cfgsrc.st2.distributions.linux) %>
    input:
      hostname: <% ctx().cfgsrc.st2.distributions.linux[item()].hostname %>
      distro: <% item() %>
      version: <% ctx().cfgsrc.st2.package_version %>
      release: <% let(ctx().cfgsrc.packagecloud.repo_name) -> [$, $.split("-").last()][int("-" in $)] %>
      pkg_env: <% let(ctx().cfgsrc.packagecloud.repo_name) -> ["", $.split("-").first()][int("-" in $)] %>
      keyfile: <% ctx().keyfile %>
      chatops: <% ctx().chatops %>
      debug: <% ctx().debug %>
      bootstrap_branch: <% ctx().cfgsrc.st2.st2bootstrap.branch %>
      windows_distro: <% ctx().windows_distro %>
      windows_instance_type: <% ctx().windows_instance_type %>
      st2tests_version: <% ctx().cfgsrc.st2.st2test.branch %>
      packagecloud_repo_path: <% ctx().cfgsrc.st2.distributions.linux[item()].packagecloud.package_path %>
    next:
      - when: <% succeeded() %>
        publish:
          - e2e_results: <% zip(ctx().cfgsrc.st2.distributions.linux.keys().toList(), result()) %>

output:
  - e2e_results: <% ctx().e2e_results %>
