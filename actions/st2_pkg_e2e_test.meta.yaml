---
name: st2_pkg_e2e_test
pack: st2ci
description: End to end test for st2 package
enabled: true
runner_type: orquesta
entry_point: workflows/st2_pkg_e2e_test.yaml
parameters:
  hostname:
    description: The hostname for the AWS instance to perform the e2e tests.
    type: string
    required: true
  dns_zone:
    type: string
    description: Hostname will be added to the Route53 DNS Zone.
    default: uswest2.stackstorm.net
  instance_type:
    type: string
    # There is no AMI which supports new C5 instance size for those distros
    default: '{% if distro in ["rhel7"] %}c4.large{% else %}c5.large{% endif %}'
  aws_environment:
    description: Create the VM instance in the AWS environment
    type: string
    enum:
      - sandbox
      - staging
      - production
    default: sandbox
  key_name:
    type: string
    default: st2_deploy
  keyfile:
    type: string
    default: /home/stanley/.ssh/stanley_rsa
  distro:
    type: string
    required: true
    enum:
      - centos7
      - rocky8
      - rocky9
      - rhel7
      - rhel8
      - ubuntu18
      - ubuntu20
      - ubuntu22
  windows_distro:
    type: string
    enum:
      - windows2016
    default: windows2016
  windows_instance_type:
    type: string
    default: t2.small
  role:
    type: string
    default: cislave
  release:
    type: string
    enum:
      - stable
      - unstable
    default: stable
  st2tests_version:
    type: string
    required: false
    default: null
  version:
    type: string
    description: The package version to tested.
  dev_build:
    type: string
    description: Repo name + CircleCI build number ('st2/3126') to install artifacts from. Overrides version.
  initial_commit:
    type: string
    description: Git hash of an initial commit from st2 repo. If provided, the workflow will update status of this commit.
  chatops:
    type: boolean
    default: false
  pkg_env:
    type: string
    enum:
      - staging
      - production
    default: production
  bootstrap_branch:
    type: string
    default: master
  bootstrap_script:
    type: string
  triggering_commit_url:
    type: string
    description: Optional info on the commit that triggered the end to end test.
  debug:
    type: boolean
    default: false
    description: When enabled, it wont delete the VM if workflow failed, leaving the machine alive for further debugging.
