---
name: st2_pkg_test_and_promote
pack: st2ci
description: Run end to end tests and promote st2 packages from staging for a given distro
enabled: true
runner_type: orquesta
entry_point: workflows/st2_pkg_test_and_promote.yaml
parameters:
  hostname:
    type: string
    description: >
      Hostname will be auto assigned to st2-pkg-<release>-<distro>-<timestamp>
      if it is not given.
  distro:
    type: string
    description: linux distribution used for package testing.
    required: true
    enum:
      - centos7
      - rocky8
      - rocky9
      - rhel7
      - rhel8
      - ubuntu18
      - ubuntu20
      - ubuntu22
  release:
    type: string
    required: true
    enum:
      - stable
      - unstable
  version:
    type: string
  keyfile:
    type: string
    default: /home/stanley/.ssh/stanley_rsa
  chatops:
    type: boolean
    default: false
  debug:
    type: boolean
    default: false
  bootstrap_branch:
    type: string
    description: The github branch to use when downloading the st2 bootstrap installation script.
    default: master
  bootstrap_script:
    type: string
    description: The URL to use to download the st2 bootstrap installation script. (Over-rides bootstrap_branch logic).
  st2tests_version:
    type: string
    description: The github branch for the st2test repository.
  windows_distro:
    type: string
    description: The name of the windows distribution to run tests against.
  windows_instance_type:
    type: string
    description: The AWS AMI to use for VM instantiation.
  pkg_env:
    type: string
    description: The packagecloud repository environment. (staging or an empty string).
    default: staging
  packagecloud_repo_path:
    type: string
    description: The packagecloud repository path for the linux distribution.
